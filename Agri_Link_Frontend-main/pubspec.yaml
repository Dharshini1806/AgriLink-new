name: agrilink
description: Smart Farm-to-Buyer Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP & Networking
  dio: ^5.4.3+1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Real-time Chat
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

  # Image
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1

  # Maps & Location
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Functional / Equality
  dartz: ^0.10.1
  equatable: ^2.0.5

  # JSON
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # UI & UX
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.0
  fl_chart: ^0.68.0
  badges: ^3.1.2
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  readmore: ^3.0.0
  timeago: ^3.6.1
  photo_view: ^0.15.0
  carousel_slider: ^5.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.2
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
